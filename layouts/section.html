{{ define "main" }}
<header class="page-head">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</header>
<section class="section section-flush">
  <div class="container">
    {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    <ul class="link-list">
      {{- range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{- end }}
    </ul>
  </div>
</section>
{{ end }}
