{{ define "main" }}
<header class="page-head">
  <div class="container narrow">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</header>
<section class="section section-flush">
  <div class="container narrow prose">
    {{ .Content }}
  </div>
</section>
{{ end }}
